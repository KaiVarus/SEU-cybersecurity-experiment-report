# Ultralytics 🚀 AGPL-3.0 License
# YOLOv10n with P2/4, P3/8, P4/16 outputs (fixed version)

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]     # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]    # 1-P2/4
  - [-1, 3, C2f, [128, True]]     # 2 (P2 output)
  - [-1, 1, Conv, [256, 3, 2]]    # 3-P3/8
  - [-1, 6, C2f, [256, True]]     # 4 (P3 output)
  - [-1, 1, SCDown, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f, [512, True]]     # 6 (P4 output)
  - [-1, 0, SCDown, [1024, 3, 2]] # 7 (disable)
  - [-1, 0, C2f, [1024, True]]    # 8 (disable)
  - [-1, 0, SPPF, [1024, 5]]      # 9 (disable)
  - [-1, 0, PSA, [1024]]          # 10 (disable)

head:
  # 上采样路径：P4 → P3 → P2
  - [6, 1, nn.Upsample, [None, 2, "nearest"]]  # 11: 从P4(40x40)上采样到80x80
  - [[-1, 4], 1, Concat, [1]]                  # 12: 与P3(80x80)拼接
  - [-1, 3, C2f, [256]]                        # 13: 融合P3 (80x80)

  # 上采样路径：P3 → P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14: 从融合P3(80x80)上采样到160x160
  - [[-1, 2], 1, Concat, [1]]                   # 15: 与P2(160x160)拼接
  - [-1, 3, C2f, [128]]                         # 16: 融合P2 (160x160)

  # 下采样路径：P2 → P3
  - [-1, 1, Conv, [128, 3, 2]]    # 17: 下采样(160x160→80x80)
  - [[-1, 13], 1, Concat, [1]]    # 18: 与融合P3(80x80)拼接
  - [-1, 3, C2f, [256]]           # 19: 增强P3 (80x80)

  # 下采样路径：P3 → P4
  - [-1, 1, SCDown, [256, 3, 2]]  # 20: 下采样(80x80→40x40)
  - [[-1, 6], 1, Concat, [1]]     # 21: 与原始P4(40x40)拼接
  - [-1, 3, C2fCIB, [512, True, True]] # 22: 增强P4 (40x40)

  # 检测层使用P2/4(160x160), P3/8(80x80), P4/16(40x40)
  - [[16, 19, 22], 1, v10Detect, [nc]] # Detect(P2, P3, P4)