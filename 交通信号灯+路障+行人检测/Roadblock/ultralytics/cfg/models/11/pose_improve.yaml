# Improved YOLO11s-pose for MPII keypoints detection
nc: 1
kpt_shape: [16, 3]
scales:
  s: [0.50, 0.50, 1024]

# Enhanced backbone with attention and better feature extraction
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C3k2, [256, False, 0.25]]  # ↑ repeats from 2 to 3
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 3, C3k2, [512, False, 0.25]]  # ↑ repeats from 2 to 3
  - [-1, 1, SEAttention, [512]]  # ↑ Add attention module
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 3, C3k2, [512, True]]   # ↑ repeats from 2 to 3
  - [-1, 1, SEAttention, [512]]  # ↑ Add attention module
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 3, C3k2, [1024, True]]  # ↑ repeats from 2 to 3
  - [-1, 1, SPPF, [1024, 5]] # 11
  - [-1, 3, C2PSA, [1024]]      # ↑ repeats from 2 to 3

# Enhanced head with better feature fusion
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]] # cat backbone P4 (adjusted index)
  - [-1, 3, C3k2, [512, False]] # 15 ↑ repeats from 2 to 3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C3k2, [256, False]] # 18 (P3/8-small) ↑ repeats

  # Add coordinate attention for keypoints
  - [-1, 1, CoordAtt, [256, 256]]  # ↑ Add coordinate attention

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]] # cat head P4
  - [-1, 3, C3k2, [512, False]] # 22 (P4/16-medium) ↑ repeats

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P5
  - [-1, 3, C3k2, [1024, True]] # 25 (P5/32-large) ↑ repeats

  # Enhanced pose detection head
  - [[18, 22, 25], 1, Pose, [nc, kpt_shape, [256, 512, 1024]]] # ↑ Add channel args