# YOLOv10n-4x object detection model with P2/4 - P4/16 outputs

# Parameters
nc: 80 # number of classes
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 1]]  # 0-P1 (no downsampling)
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4 (2x down)
  - [-1, 3, C2f, [128, True]]   # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8 (4x down)
  - [-1, 6, C2f, [256, True]]   # 4
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16 (8x down)
  - [-1, 6, C2f, [512, True]]   # 6 (final backbone output)

# Head for 4x/8x/16x outputs
head:
  # Upsample path (P4->P3)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 7
  - [[-1, 4], 1, Concat, [1]]  # 8: cat with P3/8 (layer4)
  - [-1, 3, C2f, [256]]        # 9

  # Upsample path (P3->P2)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 2], 1, Concat, [1]]  # 11: cat with P2/4 (layer2)
  - [-1, 3, C2f, [128]]        # 12 (P2/4 output)

  # Downsample path (P2->P3)
  - [-1, 1, Conv, [128, 3, 2]] # 13
  - [[-1, 9], 1, Concat, [1]]  # 14: cat with P3 fusion (layer9)
  - [-1, 3, C2f, [256]]        # 15 (P3/8 output)

  # Downsample path (P3->P4)
  - [-1, 1, SCDown, [256, 3, 2]] # 16
  - [[-1, 6], 1, Concat, [1]]  # 17: cat with P4/16 (layer6)
  - [-1, 3, C2fCIB, [512, True, True]] # 18 (P4/16 output)

  # Detect layer using P2(4x), P3(8x), P4(16x)
  - [[12, 15, 18], 1, v10Detect, [nc]]  # Detect(P2, P3, P4)