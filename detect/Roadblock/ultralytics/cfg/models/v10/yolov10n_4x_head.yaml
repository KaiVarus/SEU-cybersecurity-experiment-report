# YOLOv10n-4x-head object detection model with P2/4 - P4/16 outputs

# Parameters
nc: 80 # number of classes
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args] - 保持原始backbone不变
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]  # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]  # 4
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]   # 6
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]  # 8
  - [-1, 1, SPPF, [1024, 5]]   # 9
  - [-1, 1, PSA, [1024]]       # 10

# 修正后的Head部分 - 使用P2(4x), P3(8x), P4(16x)
head:
  # 从P5(32x)上采样到P4(16x)尺寸
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11: 从backbone输出(10)上采样 (32x→16x)
  - [[-1, 6], 1, Concat, [1]]  # 12: 与backbone的P4(16x)层(索引6)拼接 (尺寸相同)
  - [-1, 3, C2f, [512]]        # 13: 输出512通道的P4特征 (16x)

  # 从P4(16x)上采样到P3(8x)尺寸
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14: 上采样 (16x→8x)
  - [[-1, 4], 1, Concat, [1]]  # 15: 与backbone的P3(8x)层(索引4)拼接 (尺寸相同)
  - [-1, 3, C2f, [256]]        # 16: P3输出 (8x下采样)

  # 从P3(8x)上采样到P2(4x)尺寸
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 17: 上采样 (8x→4x)
  - [[-1, 2], 1, Concat, [1]]  # 18: 与backbone的P2(4x)层(索引2)拼接 (尺寸相同)
  - [-1, 3, C2f, [128]]        # 19: P2输出 (4x下采样)

  # 从P2(4x)下采样到P3(8x)尺寸
  - [-1, 1, Conv, [128, 3, 2]] # 20: 下采样 (4x→8x)
  - [[-1, 16], 1, Concat, [1]] # 21: 与层16的P3特征拼接 (尺寸相同)
  - [-1, 3, C2f, [256]]        # 22: 增强的P3输出 (8x下采样)

  # 从P3(8x)下采样到P4(16x)尺寸
  - [-1, 1, Conv, [256, 3, 2]] # 23: 下采样 (8x→16x) - 改为普通Conv
  - [[-1, 13], 1, Concat, [1]] # 24: 与层13的P4特征拼接 (尺寸相同)
  - [-1, 3, C2f, [512]]        # 25: 增强的P4输出 (16x下采样) - 使用普通C2f

  # 检测层：使用P2(4x), P3(8x), P4(16x)
  - [[19, 22, 25], 1, v10Detect, [nc]]  # Detect(P2, P3, P4)