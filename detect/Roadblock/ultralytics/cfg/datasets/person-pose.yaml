# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
#path: D:/ai_dataset/pose/train_by_yolo_MMPI/train_by_yolo_MMPI/images # dataset root dir
train: C:/ai_dataset/pose/train_by_yolo_MMPI/images/train # train images (relative to 'path') 56599 images
val: C:/ai_dataset/pose/train_by_yolo_MMPI/images/val # val images (relative to 'path') 2346 images

# Keypoints
kpt_shape: [16, 3] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
